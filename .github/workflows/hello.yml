
name: hello workflow

on:
  push:
    branches: [main]

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: say hello to users
        run: echo "hello"

      - name: say hello to username
        run: echo "hello $USER"

  details:
    runs-on: ubuntu-latest
    steps:
      - name: version of Python and Docker
        run: docker --version && python --version

